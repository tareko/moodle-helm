apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moodle.fullname" . }}-config
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
data:
  config.php: |
    <?php
    unset($CFG);
    global $CFG;
    $CFG = new stdClass();

    $CFG->dbtype    = getenv('MOODLE_DB_TYPE') ?: 'pgsql';
    $CFG->dblibrary = 'native';
    $CFG->dbhost    = getenv('MOODLE_DB_HOST') ?: 'localhost';
    $CFG->dbname    = getenv('MOODLE_DB_NAME') ?: 'moodle';
    $CFG->dbuser    = getenv('MOODLE_DB_USER') ?: 'moodle';
    $CFG->dbpass    = getenv('MOODLE_DB_PASSWORD') ?: '';
    $CFG->prefix    = 'mdl_';
    $CFG->dboptions = array(
      'dbpersist' => 0,
      'dbport' => getenv('MOODLE_DB_PORT') ?: '',
      'dbsocket' => '',
      // For PostgreSQL this should stay empty; MySQL/MariaDB can override via env.
      'dbcollation' => getenv('MOODLE_DB_COLLATION') ?: '',
      'sslmode' => getenv('MOODLE_DB_SSLMODE') ?: 'require',
    );

    $CFG->wwwroot   = getenv('MOODLE_URL') ?: 'http://localhost';
    $CFG->dataroot  = '/tmp/moodledata';
    $CFG->admin     = 'admin';

    if (!is_dir($CFG->dataroot)) {
      @mkdir($CFG->dataroot, 0770, true);
    }

    if (filter_var(getenv('MOODLE_SSLPROXY') ?: 'false', FILTER_VALIDATE_BOOLEAN)) {
      $CFG->sslproxy = true;
    }

    // Enable S3 object storage if configured
    if (filter_var(getenv('MOODLE_OBJECTFS_ENABLED') ?: 'false', FILTER_VALIDATE_BOOLEAN)) {
      $CFG->alternative_file_system_class = '\\tool_objectfs\\s3_file_system';

      // S3 configuration from environment variables
      $CFG->objectfs = new stdClass();
      $CFG->objectfs->key = getenv('MOODLE_OBJECTFS_S3_KEY') ?: '';
      $CFG->objectfs->secret = getenv('MOODLE_OBJECTFS_S3_SECRET') ?: '';
      $CFG->objectfs->bucket = getenv('MOODLE_OBJECTFS_S3_BUCKET') ?: '';
      $CFG->objectfs->region = getenv('MOODLE_OBJECTFS_S3_REGION') ?: '';
      $CFG->objectfs->endpoint = getenv('MOODLE_OBJECTFS_S3_ENDPOINT') ?: '';

      // Use path-style endpoint for DigitalOcean Spaces and other S3-compatible services
      if (filter_var(getenv('MOODLE_OBJECTFS_S3_PATH_STYLE') ?: 'false', FILTER_VALIDATE_BOOLEAN)) {
        $CFG->objectfs->use_path_style_endpoint = true;
      }

      // Optional: Configure presigned URL expiration (default 4 hours, extend to 7 days)
      $CFG->objectfs_presigned_url_expiry = 604800; // 7 days in seconds

      // Optional: Prefer remote objects for serving (for testing, may have performance impact)
      $CFG->objectfs->prefer_remote = false;
    }

    require_once(__DIR__ . '/lib/setup.php');
